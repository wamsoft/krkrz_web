<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krkrz</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#canvas {
    display: block;
    outline: none;
    border: 0;
    /* アスペクト維持でビューポートにフィット (canvas は置換要素なので
       max-width/max-height + auto で内在比率が保たれる) */
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  /* ?fit=0 : フィット無効 (CSS ピクセル等倍 + スクロール) */
  body.nofit {
    display: block;
    overflow: auto;
  }
  body.nofit canvas#canvas {
    max-width: none;
    max-height: none;
  }
  /* ローディング表示 */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #000;
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 10;
  }
  #spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #333;
    border-top-color: #ccc;
    border-radius: 50%;
    animation: krkrz-spin 1s linear infinite;
  }
  @keyframes krkrz-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="loading">
    <div id="spinner"></div>
    <div id="status">読み込み中...</div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    if (new URLSearchParams(location.search).get('fit') === '0') {
      document.body.classList.add('nofit');
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: (function () {
        var statusEl = document.getElementById('status');
        var loadingEl = document.getElementById('loading');
        return function (text) {
          if (text) {
            statusEl.textContent = text;
            loadingEl.style.display = '';
          } else {
            loadingEl.style.display = 'none';
          }
        };
      })(),
      onRuntimeInitialized: function () {
        // データ preload 完了 = 実行開始でローディングを畳む
        Module.setStatus('');
      }
    };
    Module.setStatus('読み込み中...');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
