<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krkrz</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#canvas {
    display: block;
    outline: none;
    border: 0;
    /* アスペクト維持でビューポートにフィット (canvas は置換要素なので
       max-width/max-height + auto で内在比率が保たれる) */
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  /* ?fit=0 : フィット無効 (CSS ピクセル等倍 + スクロール) */
  body.nofit {
    display: block;
    overflow: auto;
  }
  body.nofit canvas#canvas {
    max-width: none;
    max-height: none;
  }
  /* ローディング表示 */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #000;
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 10;
  }
  #spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #333;
    border-top-color: #ccc;
    border-radius: 50%;
    animation: krkrz-spin 1s linear infinite;
  }
  @keyframes krkrz-spin { to { transform: rotate(360deg); } }
  /* スクリプト例外オーバーレイ */
  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    box-sizing: border-box;
    padding: 32px 40px;
    gap: 16px;
    background: rgba(10, 12, 16, 0.94);
    color: #eaeaea;
    font-family: sans-serif;
    z-index: 20;
    overflow: auto;
  }
  #error.show { display: flex; }
  #error h2 { margin: 0; font-size: 20px; color: #ff8080; }
  #error pre {
    flex: 1;
    margin: 0;
    padding: 16px;
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow: auto;
  }
  #error .buttons { display: flex; gap: 12px; }
  #error button {
    padding: 10px 24px;
    font-size: 15px;
    border: 0;
    border-radius: 6px;
    background: #3a6ea5;
    color: #fff;
    cursor: pointer;
  }
  #error button:hover { background: #4a80bd; }
</style>
</head>
<body>
  <div id="loading">
    <div id="spinner"></div>
    <div id="status">読み込み中...</div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="error">
    <h2>スクリプトエラーが発生しました</h2>
    <pre id="error-body"></pre>
    <div class="buttons">
      <button id="error-reload">リロードして再起動</button>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('fit') === '0') {
      document.body.classList.add('nofit');
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: (function () {
        var statusEl = document.getElementById('status');
        var loadingEl = document.getElementById('loading');
        return function (text) {
          if (text) {
            statusEl.textContent = text;
            loadingEl.style.display = '';
          } else {
            loadingEl.style.display = 'none';
          }
        };
      })(),
      onRuntimeInitialized: function () {
        // データ preload 完了 = 実行開始でローディングを畳む
        Module.setStatus('');
      },
      // 未処理スクリプト例外の表示 (pre.js の krkrzOnScriptError から呼ばれる)
      showError: function (message, trace) {
        var body = document.getElementById('error-body');
        body.textContent = message + (trace ? '\n\n' + trace : '');
        document.getElementById('error').classList.add('show');
      }
    };
    document.getElementById('error-reload').addEventListener('click', function () {
      window.location.reload();
    });
    Module.setStatus('読み込み中...');
  </script>
  <!-- 起動時構成 (配信サイドカー)。krkrz.js より先に読み込み、pre.js が参照する。
       案件サイトでは stage_web.py が案件版 webconfig.js に差し替える。 -->
  <script src="webconfig.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
