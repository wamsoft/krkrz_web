<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krkrz</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#canvas {
    display: block;
    outline: none;
    border: 0;
    /* アスペクト維持でビューポートにフィット (canvas は置換要素なので
       max-width/max-height + auto で内在比率が保たれる) */
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  /* ?fit=0 : フィット無効 (CSS ピクセル等倍 + スクロール) */
  body.nofit {
    display: block;
    overflow: auto;
  }
  body.nofit canvas#canvas {
    max-width: none;
    max-height: none;
  }
  /* ローディング表示 (wasm ロード〜起動スクリプト完了まで) */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 10;
    transition: opacity 0.25s;
  }
  #loading.hide {
    opacity: 0;
    pointer-events: none;
  }
  /* resource/loading.json の image 指定で背景画像になる層 */
  #loading-bg {
    position: absolute;
    inset: 0;
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
  }
  #loading .box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #loading-count {
    font-size: 12px;
    opacity: 0.7;
    min-height: 1em;
  }
  /* ダウンロード進捗バー (wasm データ取得中のみ表示) */
  #loading-bar {
    width: 260px;
    height: 6px;
    border-radius: 3px;
    background: rgba(128, 128, 128, 0.35);
    overflow: hidden;
    display: none;
  }
  #loading-bar-fill {
    height: 100%;
    width: 0;
    background: currentColor;
    opacity: 0.85;
    transition: width 0.15s;
  }
  #spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #333;
    border-top-color: #ccc;
    border-radius: 50%;
    animation: krkrz-spin 1s linear infinite;
  }
  @keyframes krkrz-spin { to { transform: rotate(360deg); } }
  /* スクリプト例外オーバーレイ */
  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    box-sizing: border-box;
    padding: 32px 40px;
    gap: 16px;
    background: rgba(10, 12, 16, 0.94);
    color: #eaeaea;
    font-family: sans-serif;
    z-index: 20;
    overflow: auto;
  }
  #error.show { display: flex; }
  #error h2 { margin: 0; font-size: 20px; color: #ff8080; }
  #error pre {
    flex: 1;
    margin: 0;
    padding: 16px;
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow: auto;
  }
  #error .buttons { display: flex; gap: 12px; }
  #error button {
    padding: 10px 24px;
    font-size: 15px;
    border: 0;
    border-radius: 6px;
    background: #3a6ea5;
    color: #fff;
    cursor: pointer;
  }
  #error button:hover { background: #4a80bd; }
</style>
</head>
<body>
  <div id="loading">
    <div id="loading-bg"></div>
    <div class="box">
      <div id="spinner"></div>
      <div id="status">読み込み中...</div>
      <div id="loading-bar"><div id="loading-bar-fill"></div></div>
      <div id="loading-count"></div>
    </div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="error">
    <h2>スクリプトエラーが発生しました</h2>
    <pre id="error-body"></pre>
    <div class="buttons">
      <button id="error-reload">リロードして再起動</button>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('fit') === '0') {
      document.body.classList.add('nofit');
    }

    // ?loading=0 : 旧挙動 (wasm ロード完了でローディングを畳む。デバッグ用)。
    // 既定はエンジンの起動スクリプト完了通知 (krkrzOnStartupScriptDone →
    // Module.krkrzHideLoading) まで表示を維持する。
    var krkrzLoadingLegacy =
      new URLSearchParams(location.search).get('loading') === '0';

    var Module = {
      canvas: document.getElementById('canvas'),
      // 起動スクリプト実行中に表示するテキスト (resource/loading.json の
      // "text" で pre.js が差し替える)
      krkrzBootText: '読み込み中...',
      krkrzLoadingDone: false,
      setStatus: (function () {
        var statusEl = document.getElementById('status');
        var loadingEl = document.getElementById('loading');
        var barEl = document.getElementById('loading-bar');
        var fillEl = document.getElementById('loading-bar-fill');
        var mb = function (n) { return (n / 1048576).toFixed(1) + 'MB'; };
        // ダウンロード進捗はストリーム別 (wasm 本体 / データバンドル) に届くので
        // ラベルごとに保持して合算表示する (2 本が並行して status を取り合い
        // バーが行き来しないように)
        var dlStats = {};
        return function (text) {
          if (text) {
            // "(loaded/total)" 形式をプログレスバー + 実サイズ表記に変換する
            var m = /^(.*?)\s*\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)\s*$/.exec(text);
            if (m) {
              dlStats[m[1]] = { l: parseFloat(m[2]), t: parseFloat(m[3]) };
              var loaded = 0, total = 0;
              for (var k in dlStats) { loaded += dlStats[k].l; total += dlStats[k].t; }
              statusEl.textContent = 'ダウンロード中 ' + mb(loaded) + ' / ' + mb(total);
              fillEl.style.width = (total > 0 ? (loaded / total) * 100 : 0) + '%';
              barEl.style.display = 'block';
            } else {
              statusEl.textContent = text;
              barEl.style.display = 'none';
            }
            loadingEl.style.display = '';
          } else if (krkrzLoadingLegacy || Module.krkrzLoadingDone) {
            loadingEl.style.display = 'none';
          } else {
            // wasm ロードは終わったがエンジン起動スクリプトが未完了:
            // 表示を維持してブート用テキストに切り替える
            statusEl.textContent = Module.krkrzBootText;
            barEl.style.display = 'none';
            loadingEl.style.display = '';
          }
        };
      })(),
      // 起動スクリプト完了 (pre.js の krkrzOnStartupScriptDone) から呼ばれる
      krkrzHideLoading: function () {
        Module.krkrzLoadingDone = true;
        var loadingEl = document.getElementById('loading');
        loadingEl.classList.add('hide');
        setTimeout(function () { loadingEl.style.display = 'none'; }, 300);
      },
      onRuntimeInitialized: function () {
        // データ preload 完了 = 実行開始。既定はブート表示に切替のみ
        // (?loading=0 ならここで畳む)
        Module.setStatus('');
      },
      // 未処理スクリプト例外の表示 (pre.js の krkrzOnScriptError から呼ばれる)
      showError: function (message, trace) {
        var body = document.getElementById('error-body');
        body.textContent = message + (trace ? '\n\n' + trace : '');
        document.getElementById('error').classList.add('show');
      }
    };
    document.getElementById('error-reload').addEventListener('click', function () {
      window.location.reload();
    });
    Module.setStatus('読み込み中...');
  </script>
  <!-- 起動時構成 (配信サイドカー)。krkrz.js より先に読み込み、pre.js が参照する。
       案件サイトでは stage_web.py が案件版 webconfig.js に差し替える。 -->
  <script src="webconfig.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
